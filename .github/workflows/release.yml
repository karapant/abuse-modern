name: Package releases
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libgl-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkgconf
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build with bundled SDL
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_mixer=ON
          cmake --build build --parallel 2
      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure
      - name: Build and test Windows with bundled SDL
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_mixer=ON \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install pyinstaller==6.12.0 certifi==2026.10.23
          python scripts/package-release.py --platform "$TARGET_PLATFORM"
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python="$(cygpath -u "$pythonLocation")/python.exe"
          "$python" -m pip install pyinstaller==6.12.0 certifi==2026.10.23
          "$python" scripts/package-release.py --platform windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
  publish:
    if: github.event_name != 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Attach binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            gh release upload "$RELEASE_TAG" packages/*
            exit
          fi

          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          case "$draft" in
            true)
              gh release upload "$RELEASE_TAG" packages/* --clobber
              gh release edit "$RELEASE_TAG" --draft=false
              ;;
            false)
              echo "Release $RELEASE_TAG is already published."
              ;;
            *)
              gh release create "$RELEASE_TAG" packages/* --verify-tag --notes-from-tag \
                --title "Abuse Modern $RELEASE_TAG"
              ;;
          esac
